# Runs `cargo xtask check` on macOS (arm64), Windows (x64) and Linux (x64) for
# every pull request and every push to main, and when started by hand
# (`gh workflow run ci.yml --ref <branch>`).
#
# The workflow also:
#
# - cancels a run when a newer commit supersedes it;
# - restores the dependency cache on every run, but saves it only from main,
#   so pull requests share main's cache instead of filling the quota;
# - times out a hung job after 30 minutes rather than the default six hours;
# - runs the format validators on the example plug-ins (`cargo xtask
#   validate`), with clap-validator built from source at a pinned revision and
#   cached per platform, so it's compiled once until the pin changes;
# - on Linux, runs the benchmark gate (`cargo xtask bench --gate`): Valgrind
#   counts every benchmark's instructions, since timing on shared runners is
#   too noisy, and the job fails if any is more than 3 % above
#   bench/baseline.json.
#
# Timing belongs on fixed reference machines: a nightly workflow of its own
# (bench-nightly.yml, beside this file) will run `cargo xtask bench --machine
# <name>` on each and keep the JSON it writes for a history dashboard, once
# the machines are set up.
#
# A failure on one platform doesn't cancel the others (fail-fast is off), so
# one run reports every platform's failures.
#
# Every third-party action is pinned to a full commit SHA, with its version in
# a comment. Update the SHA and the comment together.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  # clap-validator's revision (free-audio/clap-validator, after 0.4.1). Change
  # it here only; the cache key follows it.
  CLAP_VALIDATOR_REV: b2f1d9b79b1d264a5747f46707d72b1aa40a02ef

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
          - name: Windows x64
            os: windows-2025
          - name: Linux x64
            os: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      # rustfmt.toml asks for Unix line endings, and the Windows runner's Git
      # would otherwise check files out with CRLF, failing `cargo fmt --check`.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # With no argument, rustup installs the toolchain, profile and
      # components named in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version

      - name: Restore the dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # cargo-nextest's version is pinned in xtask/src/main.rs and
      # .config/nextest.toml too; keep the three in step.
      - name: Install cargo-deny and cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2,cargo-nextest@0.9.146
          # A prebuilt, checksummed binary or nothing: never compile it here.
          fallback: none

      - name: Restore clap-validator
        id: clap-validator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.clap-validator
          key: clap-validator-${{ runner.os }}-${{ runner.arch }}-${{ env.CLAP_VALIDATOR_REV }}

      - name: Install clap-validator
        if: steps.clap-validator.outputs.cache-hit != 'true'
        run: >-
          cargo install --locked
          --git https://github.com/free-audio/clap-validator
          --rev "$CLAP_VALIDATOR_REV"
          --root "$HOME/.clap-validator"
          clap-validator

      - name: cargo xtask check
        env:
          NEXTEST_PROFILE: ci
        run: cargo xtask check

      # The VST3 and Audio Unit exports add their validators' installs above
      # (the Steinberg validator, pluginval, auval on macOS), and `cargo xtask
      # validate` runs them with clap-validator.
      - name: cargo xtask validate
        if: ${{ !cancelled() }}
        run: |
          export PATH="$HOME/.clap-validator/bin:$PATH"
          cargo xtask validate

      - name: Install Valgrind
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends valgrind

      # The SIMD paths' agreement test first, printing which paths this
      # runner has; then the gate.
      - name: cargo xtask bench --gate
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        run: |
          cargo test --locked -p lspk-dsp --lib simd -- --nocapture
          cargo xtask bench --gate
