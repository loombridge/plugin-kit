# Dependency policy, checked by `cargo xtask check` through cargo-deny.
#
# The plug-in kit is MIT OR Apache-2.0, so that any plug-in can build on it,
# whatever its own licence. It therefore takes no copyleft dependency: every
# dependency must be under a permissive licence. `cargo xtask deny-selftest`
# proves this file still rejects GPL, LGPL and AGPL crates.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.93
# The allow-list is policy, not an inventory, so licences no dependency uses yet
# are expected.
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Deliberately absent: every copyleft licence, strong or weak (GPL, LGPL,
# AGPL, MPL, EPL, CDDL, OFL), as well as SSPL and proprietary licences. Adding
# a weak copyleft licence, for example for a bundled font, needs a decision
# first.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path, without a version.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
