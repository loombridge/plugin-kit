[package]
name = "lspk-example-gain"
description = "A stereo gain effect built on the plug-in kit, for the kit's tests and as the seed of its effect template. Never published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish = false

[lib]
# The cdylib is the CLAP plug-in; the rlib lets its tests reach its types and
# its entry point, and makes Cargo build the cdylib beside them.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Its own command, `gain.reset`.
lspk-commands.workspace = true
lspk-params.workspace = true
# CLAP natively, with VST3 and (on macOS) Audio Unit v2 made from it.
lspk-plugin = { workspace = true, features = ["clap", "vst3", "auv2"] }
# The agent interface: its parameters and commands as tools, and its own MCP
# server, off until the person switches it on.
lspk-plugin-agent.workspace = true
# Its command's arguments and results.
serde_json = "1"

[dev-dependencies]
lspk-agent.workspace = true
lspk-rt.workspace = true
lspk-test.workspace = true

[lints]
workspace = true
