[package]
name = "lspk-plugin"
description = "The format layer: one Plugin trait, exported as CLAP natively, as VST3 and Audio Unit, as a standalone app and as a native Beatlayer device."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[features]
default = ["clap"]
# The CLAP export (`export_clap!`), through clack.
clap = ["dep:clack-plugin", "dep:clack-extensions"]
# The VST3 export, made from the CLAP export by clap-wrapper.
vst3 = ["clap", "dep:lspk-clap-wrapper", "lspk-clap-wrapper/vst3"]
# The Audio Unit v2 export (macOS), made from the CLAP export by clap-wrapper.
auv2 = ["clap", "dep:lspk-clap-wrapper", "lspk-clap-wrapper/auv2"]

[dependencies]
lspk-commands.workspace = true
lspk-params.workspace = true
# Command arguments and results, as lspk-commands takes them.
serde_json = "1"
# The main thread's parameter edits reach the audio thread through this queue,
# as lspk-rt's logger uses it.
rtrb = "0.4.0"
# Pinned exactly, as clack-host is in Beatlayer's plug-in host: clack's API
# moves between releases.
clack-plugin = { version = "=0.2.0", optional = true }
clack-extensions = { version = "=0.2.0", optional = true, features = [
    "clack-plugin",
    "audio-ports",
    "gui",
    "latency",
    "note-ports",
    "params",
    "remote-controls",
    "state",
    "tail",
    "track-info",
] }
lspk-clap-wrapper = { workspace = true, optional = true }

[dev-dependencies]
lspk-rt.workspace = true
lspk-test.workspace = true

[lints]
workspace = true
