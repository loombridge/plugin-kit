[package]
name = "lspk-dsp"
description = "DSP building blocks: band-limited and wavetable oscillators, interpolators, zero-delay-feedback filters, envelopes, LFOs, oversampling, FFT, resampling, SIMD helpers and waveshapers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
# Parameter smoothing (`smooth`), re-exported.
lspk-params.workspace = true
# The analyser's FFT; pure Rust, as lspk-wavetable's.
realfft = "3.5.0"
# The pole-zero filter's design, as presets store it.
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }

[dev-dependencies]
# The micro-benchmarks' suite format.
lspk-test.workspace = true
# The allocation trap, for the real-time tests.
lspk-rt.workspace = true
# The pole-zero design's round trip through JSON.
serde_json = "1"

# Micro-benchmarks for the hot paths, run by `cargo xtask bench` (timing) and
# counted by its instruction-count gate.
[[bench]]
name = "perf"
harness = false

[lints]
workspace = true
