[package]
name = "lspk-dsp"
description = "DSP building blocks: band-limited and wavetable oscillators, interpolators, zero-delay-feedback filters, envelopes, LFOs, oversampling, FFT, resampling, SIMD helpers and waveshapers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
# Parameter smoothing (`smooth`), re-exported.
lspk-params.workspace = true

[dev-dependencies]
# The micro-benchmarks' suite format.
lspk-test.workspace = true

# Micro-benchmarks for the hot paths, run by `cargo xtask bench` (timing) and
# counted by its instruction-count gate.
[[bench]]
name = "perf"
harness = false

[lints]
workspace = true
