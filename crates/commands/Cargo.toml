[package]
name = "lspk-commands"
description = "The command registry: every user-facing action with its ID, label, model-facing description, permission class and argument and result schemas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
# Pinned: a program's command reference is generated from these schemas, so
# an upgrade is a deliberate change that regenerates it.
schemars = { version = "=1.2.2", default-features = false, features = ["std", "derive"] }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = "1"

[lints]
workspace = true
