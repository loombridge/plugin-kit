[package]
name = "lspk-test"
description = "The headless test harness: renders, golden renders and null tests, measurement tools, format validators and a scripted MCP client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[features]
default = ["hosts"]
# The CLAP, VST3 and Audio Unit hosts for tests. Without them the crate is the
# render harness and the measurements, which a plug-in may use at run time.
hosts = ["dep:clack-host", "dep:clack-extensions", "dep:vst3", "lspk-plugin/clap-host", "dep:lspk-commands"]

[dependencies]
# The in-process harness drives a plug-in through its traits; the CLAP export
# isn't needed.
lspk-plugin = { workspace = true, default-features = false }
lspk-params.workspace = true
lspk-rt.workspace = true
# The commands a hosted plug-in lists through the agent-commands extension.
lspk-commands = { workspace = true, optional = true }
# The plug-in's own parameter edits reach the processor through this queue, as
# lspk-plugin's adapters take them.
rtrb = "0.4.0"
# The scripted MCP client for agent tests.
lspk-agent.workspace = true
# A CLAP host for tests, pinned exactly as lspk-plugin pins clack-plugin.
clack-host = { version = "=0.2.0", optional = true }
clack-extensions = { version = "=0.2.0", optional = true, features = [
    "clack-host",
    "audio-ports",
    "latency",
    "note-ports",
    "params",
    "remote-controls",
    "state",
    "tail",
    "track-info",
] }
# Spectra for the measurements; pure Rust, as Beatlayer's analysis uses.
realfft = "3.5.0"
# Golden references: written as 24-bit FLAC with flacenc and read back with
# claxon, both pure Rust, as Beatlayer's golden tests do.
flacenc = { version = "0.5.1", default-features = false }
claxon = "0.4.3"
# The golden manifest.
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = "1"
# Audio an agent tool returns, which comes as WAV.
hound = "3.5.1"
# A VST3 host for tests: bindings generated from the VST3 SDK's headers,
# pinned exactly as clack is.
vst3 = { version = "=0.3.0", optional = true }

[dev-dependencies]
lspk-commands.workspace = true
schemars = { version = "=1.2.2", default-features = false, features = ["std", "derive"] }

[lints]
workspace = true
