[package]
name = "lspk-standalone"
description = "The standalone app: any kit plug-in run as an application, with audio and MIDI device handling, settings and state files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
# The plug-in's two halves, driven through their traits; no format export.
lspk-plugin.workspace = true
lspk-params.workspace = true
# The audio thread's set-up and real-time sections.
lspk-rt.workspace = true
# The edit, MIDI and input queues, as lspk-plugin's own.
rtrb = "0.4.0"
# Audio devices: Core Audio, WASAPI and ALSA. The same release Beatlayer's
# audio I/O uses.
cpal = "0.18.2"
# MIDI inputs: CoreMIDI, Windows' MIDI and ALSA sequencer.
midir = "0.11.1"
# The window: egui in a baseview window, drawn with the kit's interface
# crate, at the egui-baseview release lspk-ui pins.
lspk-ui.workspace = true
egui-baseview = { version = "=0.8.1", default-features = false, features = [
    "opengl",
    "log",
] }
# The app's window as the editor's parent.
raw-window-handle = "0.6.2"
# Native dialogs for opening and saving state files; on Linux through the
# desktop portal, with no GTK.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# The settings file.
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = "1"

# The menu bar: the app's on macOS, the window's on Windows. Linux has none
# without GTK, which the app doesn't take.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
muda = { version = "0.21.2", default-features = false }

# The end of the window's key handling, so keys nothing takes don't
# sound the system alert (`key_sink`), and the screen's room for the
# window (`screen`). The releases muda already brings.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSEvent",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSScreen",
    "objc2-core-foundation",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }

[target.'cfg(windows)'.dependencies]
# The window's style, so it doesn't draw over the editor inside it.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
lspk-rt.workspace = true

[lints]
workspace = true
