# Runs `cargo xtask check` and `cargo xtask validate` on macOS (arm64),
# Windows (x64) and Linux (x64) for every pull request and every push to
# main, and when started by hand (`gh workflow run ci.yml --ref <branch>`).
#
# The workflow also:
#
# - cancels a run when a newer commit supersedes it;
# - restores the dependency cache on every run, but saves it only from main,
#   so pull requests share main's cache instead of filling the quota;
# - times out a hung job after 45 minutes rather than the default six hours;
# - runs the format validators on the plug-in (`cargo xtask validate`), with
#   clap-validator built from source at a pinned revision and cached per
#   platform, and on macOS pluginval from a pinned release, checked against
#   its SHA-256;
# - on Linux, runs the benchmark gate (`cargo xtask bench --gate`): Valgrind
#   counts every benchmark's instructions, since timing on shared runners is
#   too noisy, and the job fails if any is more than 3 % above
#   bench/baseline.json.
#
# A failure on one platform doesn't cancel the others (fail-fast is off), so
# one run reports every platform's failures.
#
# Every third-party action is pinned to a full commit SHA, with its version in
# a comment, as the plug-in kit pins them. Update the SHA and the comment
# together.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  # clap-validator's revision (free-audio/clap-validator, after 0.4.1). Change
  # it here only; the cache key follows it.
  CLAP_VALIDATOR_REV: b2f1d9b79b1d264a5747f46707d72b1aa40a02ef
  # pluginval's release (Tracktion/pluginval) and the SHA-256 of its macOS
  # archive. A tool only: never linked into anything, never committed.
  PLUGINVAL_VERSION: v1.0.4
  PLUGINVAL_MACOS_SHA256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
          - name: Windows x64
            os: windows-2025
          - name: Linux x64
            os: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      # rustfmt.toml asks for Unix line endings, and the Windows runner's Git
      # would otherwise check files out with CRLF, failing `cargo fmt --check`.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # With no argument, rustup installs the toolchain, profile and
      # components named in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version

      # ALSA's headers, which the standalone app's audio and MIDI build
      # against on Linux.
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libasound2-dev

      - name: Restore the dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # cargo-nextest's version is pinned in .config/nextest.toml too; keep
      # the two in step.
      - name: Install cargo-deny and cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2,cargo-nextest@0.9.146
          # A prebuilt, checksummed binary or nothing: never compile it here.
          fallback: none

      - name: Restore clap-validator
        id: clap-validator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.clap-validator
          key: clap-validator-${{ runner.os }}-${{ runner.arch }}-${{ env.CLAP_VALIDATOR_REV }}

      - name: Install clap-validator
        if: steps.clap-validator.outputs.cache-hit != 'true'
        run: >-
          cargo install --locked
          --git https://github.com/free-audio/clap-validator
          --rev "$CLAP_VALIDATOR_REV"
          --root "$HOME/.clap-validator"
          clap-validator

      - name: Install pluginval
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pluginval.zip" \
            "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
          echo "$PLUGINVAL_MACOS_SHA256  $RUNNER_TEMP/pluginval.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/pluginval.zip" -d "$RUNNER_TEMP/pluginval"
          echo "$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS" >> "$GITHUB_PATH"

      - name: cargo xtask check
        env:
          NEXTEST_PROFILE: ci
        run: cargo xtask check

      # Every format's validators on the plug-in: clap-validator, Steinberg's
      # VST3 validator (which xtask builds from the kit's vendored VST3 SDK)
      # on every platform, and on macOS auval and pluginval.
      - name: cargo xtask validate
        if: ${{ !cancelled() }}
        run: |
          export PATH="$HOME/.clap-validator/bin:$PATH"
          cargo xtask validate

      - name: Install Valgrind
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends valgrind

      - name: cargo xtask bench --gate
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        run: cargo xtask bench --gate
