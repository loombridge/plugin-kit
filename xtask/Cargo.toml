[package]
name = "lspk-xtask"
description = "Repository tasks for the plug-in kit: `cargo xtask check` and friends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# Lays out plug-in files for `cargo xtask bundle`; no format export needed.
lspk-plugin.workspace = true
# Reads each plug-in's CLAP descriptor for `cargo xtask bundle`, pinned as
# lspk-test pins it.
clack-host = "=0.2.0"
serde_json = "1"

[lints]
workspace = true
